name: Deploying application to EC2
on:
  workflow_dispatch: 
jobs:
  aws_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: cloning github repo
        uses: actions/checkout@v7.0.0
      - name: Copy website files to path
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "./*"
          target: "/tmp/website"
      - name: Deploy into ec2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo cp -r /tmp/website/* /var/www/html
            sudo systemctl reload nginx
          
